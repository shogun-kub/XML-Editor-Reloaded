name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Publish the built packages as a GitHub pre-release
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve version and release tag
        id: release
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_TYPE -eq 'tag') {
              if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') {
                  throw "Final release tags must look like v1.2.3; got '$env:GITHUB_REF_NAME'."
              }
              $version = $Matches[1]
              $tag = $env:GITHUB_REF_NAME
              $prerelease = 'false'
          }
          else {
              if ($env:GITHUB_REF_NAME -notmatch '^release/(\d+\.\d+\.\d+)$') {
                  throw "Manual release runs must start from a release/x.y.z branch; got '$env:GITHUB_REF_NAME'."
              }
              $version = $Matches[1]
              $tag = "pre-v$version-$($env:GITHUB_RUN_NUMBER)"
              $prerelease = '${{ inputs.publish_prerelease }}'
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          "branch=$env:GITHUB_REF_NAME" >> $env:GITHUB_OUTPUT

      - name: Build release packages
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./util-scripts/release.ps1 -Version "${{ steps.release.outputs.version }}"
          if ($LASTEXITCODE -ne 0) {
              throw "Release packaging failed with exit code $LASTEXITCODE."
          }

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: xml-editor-reloaded-${{ steps.release.outputs.version }}
          path: out/release/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' || inputs.publish_prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $version = "${{ steps.release.outputs.version }}"
          $prerelease = "${{ steps.release.outputs.prerelease }}" -eq 'true'
          $zips = @(Get-ChildItem -LiteralPath out/release -Filter '*.zip')
          $hashes = @(Get-ChildItem -LiteralPath out/release -Filter '*.sha256')
          if ($zips.Count -ne 2 -or $hashes.Count -ne 2) {
              throw "Expected two release archives and two checksums; found $($zips.Count) and $($hashes.Count)."
          }

          $assets = @($zips.FullName) + @($hashes.FullName)
          $arguments = @('release', 'create', $tag) + $assets + @(
              '--title', "XML Editor Reloaded $version",
              '--generate-notes')
          if ($prerelease) {
              $arguments += '--prerelease'
              $arguments += '--target'
              $arguments += "${{ steps.release.outputs.branch }}"
          }

          gh @arguments
