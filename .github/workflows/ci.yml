name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'release/**'
  pull_request:
    branches:
      - main
      - dev
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore xml-editor-reloaded/XmlEditorReloaded.slnx

      - name: Build
        run: dotnet build xml-editor-reloaded/XmlEditorReloaded.slnx --configuration Release -m:1 --no-restore -warnaserror

      - name: Test
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File util-scripts/test.ps1 -Configuration Release -NoBuild

      # UI smoke needs an interactive desktop and is intentionally not part of CI.
      # This workflow never uploads artifacts; release.yml owns packages and releases.
